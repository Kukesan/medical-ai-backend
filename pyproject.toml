[project]
name = "yarlit-medical-ai-backend"
version = "0.1.0"
description = "AI-powered medical report and prescription cross-checker backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.6",
  "numpy>=2.0.1",
  "structlog>=24.4.0",
  "tenacity>=8.5.0",
  "slowapi>=0.1.9",
  "scalar-fastapi>=1.0.0",
  "langchain>=0.2.16",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "respx>=0.21.1",
  "ruff>=0.6.2",
  "mypy>=1.11.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
